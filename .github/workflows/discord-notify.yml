name: Discord Notify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify on push
        if: github.event_name == 'push'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "새 커밋 푸시"
          description: "${{ github.event.head_commit.message }}"
          color: 0x57F287

      - name: Notify on PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "PR 오픈: ${{ github.event.pull_request.title }}"
          description: "${{ github.event.pull_request.html_url }}"
          color: 0x5865F2

      - name: Notify on PR merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "PR 머지: ${{ github.event.pull_request.title }}"
          description: "${{ github.event.pull_request.html_url }}"
          color: 0x9B59B6

      - name: Notify on PR closed
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "PR 닫힘: ${{ github.event.pull_request.title }}"
          description: "${{ github.event.pull_request.html_url }}"
          color: 0xED4245

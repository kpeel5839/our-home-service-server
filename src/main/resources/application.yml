spring:
  datasource:
    url: jdbc:h2:mem:ourhomedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

# ──────────────────────────────────────────────────────────────────────────────
# Discord 웹훅 설정
# webhook-url: Discord 채널 웹훅 URL
#              환경변수 DISCORD_WEBHOOK_URL 로 오버라이드 가능
# ──────────────────────────────────────────────────────────────────────────────
discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}

# ──────────────────────────────────────────────────────────────────────────────
# 카카오 OAuth 설정
# ──────────────────────────────────────────────────────────────────────────────
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  user-info-uri: https://kapi.kakao.com/v2/user/me
  token-uri: https://kauth.kakao.com/oauth/token

# ──────────────────────────────────────────────────────────────────────────────
# JWT 설정
# secret: 최소 32자 이상의 랜덤 문자열 (HS256)
# expiry-ms: 토큰 만료 시간 (기본 7일)
# ──────────────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS}
